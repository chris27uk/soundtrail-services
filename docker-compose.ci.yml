# CI sidecars for the published testhost. Local default remains Embedded + Testcontainers.
# Usage: docker compose -f docker-compose.ci.yml up -d redis openservicebus ravendb

name: soundtrail-ci

services:
  redis:
    # linux/amd64 7.4.10-alpine. pull_policy missing: GHA cache load skips Hub extract.
    image: redis:7-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
    pull_policy: missing
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  openservicebus:
    # Pin linux/amd64; :latest moves. pull_policy missing after GHA docker load.
    image: mauritsarissen/openservicebus:latest@sha256:72ec683f93d8de419b58030a2652d4065f3aa8fac77d3c1f7f468c860c5af3cd
    pull_policy: missing
    environment:
      OPENSERVICEBUS__STORAGE__MODE: InMemory
      OPENSERVICEBUS_CONFIG: /etc/openservicebus/config.json
    volumes:
      - ./Soundtrail.Services.AppHost/servicebus-emulator/Config.json:/etc/openservicebus/config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"

  ravendb:
    # Pin to client 7.2.5. Spike: Embedded nupkg ~890MB vs this image ~378MB compressed (linux-only).
    image: ravendb/ravendb:7.2.5-ubuntu.24.04-x64@sha256:d8f45d0eed364f79235d36c64d7f74d01185b17c0d23b74b8515e0cba848dc6d
    pull_policy: missing
    environment:
      RAVEN_Setup_Mode: None
      RAVEN_License_Eula_Accepted: "true"
      RAVEN_Security_UnsecuredAccessAllowed: PublicNetwork
      RAVEN_ServerUrl: http://0.0.0.0:8080
      RAVEN_ServerUrl_Tcp: tcp://0.0.0.0:38888
      RAVEN_PublicServerUrl: http://ravendb:8080
      RAVEN_PublicServerUrl_Tcp: tcp://ravendb:38888
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/ravendb/scripts/healthcheck.sh"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 15s

  testhost:
    image: soundtrail-testhost:ci
    depends_on:
      redis:
        condition: service_healthy
      ravendb:
        condition: service_healthy
      openservicebus:
        condition: service_started
    environment:
      SOUNDTRAIL_TEST_NO_TESTCONTAINERS: "true"
      SOUNDTRAIL_TEST_REDIS: "redis:6379,abortConnect=false"
      SOUNDTRAIL_TEST_SERVICEBUS: "Endpoint=sb://openservicebus:5672;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true"
      SOUNDTRAIL_TEST_RAVEN: "http://ravendb:8080"
      GITVERSION_INFORMATIONALVERSION: "${GITVERSION_INFORMATIONALVERSION:-}"
      OTEL_SERVICE_VERSION: "${OTEL_SERVICE_VERSION:-}"
    volumes:
      - ./reports:/reports
    command:
      # 2 vCPU GHA runners: unlimited+aggressive saturates the box and starves E2E hosts.
      - --max-threads
      - "2x"
      - --parallel-algorithm
      - conservative
      - --report-xunit-trx
      - --report-xunit-trx-filename
      - tests.trx
      - --results-directory
      - /reports
