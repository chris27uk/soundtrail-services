# Pre-started Redis + Azure Service Bus emulator for CI.
# SQL backend: Azure SQL Edge (official emulator pairing) — much faster cold start
# than mssql/server, which re-runs system-DB upgrades (927→957) on every empty volume.
# Emulator image is distroless — readiness is checked from the host via :5300/health.
name: soundtrail-test-infra

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [soundtrail-test]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Retired product, but still the image Microsoft ships with the SB emulator
  # installer and far quicker to become ready than full SQL Server on CI.
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:1.0.7
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Soundtrail_CI_Passw0rd!"
    networks:
      soundtrail-test:
        aliases: [sqledge, mssql]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -C -S localhost -U sa -P 'Soundtrail_CI_Passw0rd!' -Q 'SELECT 1' || exit 1"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2
    depends_on:
      sqledge:
        condition: service_healthy
    volumes:
      - ${SOUNDTRAIL_SERVICEBUS_CONFIG:-../../Soundtrail.Services.AppHost/servicebus-emulator/Config.json}:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Soundtrail_CI_Passw0rd!"
      ACCEPT_EULA: "Y"
      SQL_WAIT_INTERVAL: "1"
      EMULATOR_HTTP_PORT: "5300"
    networks:
      soundtrail-test:
        aliases: [servicebus-emulator, sb-emulator]

networks:
  soundtrail-test:
    name: soundtrail-test
    driver: bridge
