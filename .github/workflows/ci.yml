name: CI

on:
  push:
    branches: [main]
    # Release job on main pushes v${{ semVer }}; that tag run seeds image/BuildKit caches.
    tags: ['v*']
  pull_request:
    branches: [main]

run-name: "${{ github.event.pull_request.title || github.ref_name }} (${{ github.run_number }})"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write
  actions: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      imageCacheKey: ${{ steps.gitversion.outputs.imageCacheKey }}
      imageCacheFallback: ${{ steps.gitversion.outputs.imageCacheFallback }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Shallow + tags; /allowshallow + next-version floor cover Mainline base.
          fetch-depth: 100
          fetch-tags: true

      # Standalone binary (~34MB) — avoids Docker (~188MB) and SDK (global.json pins 10.0.301).
      - name: Restore GitVersion binary
        id: gv-bin-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/gitversion-bin
          key: gitversion-bin-linux-x64-6.7.0

      - name: Restore previous SemVer floor
        id: gv-semver-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/gitversion-prev
          key: gitversion-semver-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            gitversion-semver-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-

      - name: Determine version
        id: gitversion
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITVERSION_URL: https://github.com/GitTools/GitVersion/releases/download/6.7.0/gitversion-linux-x64-6.7.0.tar.gz
        run: |
          set -euo pipefail

          # Ensure base branch is in the shallow window (PR / feature branch merge-base).
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=100 origin "${base_ref}:refs/remotes/origin/${base_ref}" || true

          mkdir -p /tmp/gitversion-bin /tmp/gitversion-prev
          gv_bin=/tmp/gitversion-bin/gitversion
          if [[ ! -x "$gv_bin" ]]; then
            echo "Downloading GitVersion binary"
            curl -fsSL "$GITVERSION_URL" | tar -xzf - -C /tmp/gitversion-bin
            chmod +x "$gv_bin"
            echo "need_bin_cache=true" >> "$GITHUB_OUTPUT"
          fi

          # Floor: previous CI MajorMinorPatch on this ref, else latest v* tag.
          # Passed via /overrideconfig next-version (env placeholders are not expanded there).
          floor=""
          if [[ -f /tmp/gitversion-prev/majorMinorPatch ]]; then
            floor=$(tr -d '[:space:]' < /tmp/gitversion-prev/majorMinorPatch)
            echo "SemVer floor from previous CI: ${floor}"
          fi
          last_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD 2>/dev/null || true)
          if [[ -z "$floor" && -n "$last_tag" ]]; then
            floor="${last_tag#v}"
            echo "SemVer floor from tag: ${floor}"
          fi

          gv_args=(/allowshallow /verbosity Quiet /output json)
          if [[ -n "$floor" ]]; then
            gv_args+=(/overrideconfig "next-version=${floor}")
          fi

          set +e
          "$gv_bin" "${gv_args[@]}" > /tmp/gitversion.json 2> /tmp/gitversion.err
          gv_exit=$?
          set -e

          if [[ -s /tmp/gitversion.err ]]; then
            echo "GitVersion stderr:" >&2
            cat /tmp/gitversion.err >&2
          fi

          if [[ $gv_exit -ne 0 ]]; then
            echo "::error::GitVersion exited with code $gv_exit"
            echo "GitVersion stdout:" >&2
            cat /tmp/gitversion.json >&2 || true
            exit "$gv_exit"
          fi

          jq -r '
            "semVer=\(.SemVer)",
            "assemblySemVer=\(.AssemblySemVer)",
            "informationalVersion=\(.InformationalVersion)",
            "majorMinorPatch=\(.MajorMinorPatch)"
          ' /tmp/gitversion.json >> "$GITHUB_OUTPUT"

          jq -r '.MajorMinorPatch' /tmp/gitversion.json > /tmp/gitversion-prev/majorMinorPatch
          jq -r '.SemVer' /tmp/gitversion.json > /tmp/gitversion-prev/semVer

          # Last release on this ancestry (branch → main's last tag; tag → that tag).
          fallback="${last_tag:-none}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Exact current tag first; fallback is previous release for a warm miss.
            cache_key="${GITHUB_REF_NAME}"
            prev_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)
            fallback="${prev_tag:-$fallback}"
          elif [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            # Stable across PR commits so later pushes reuse this PR's saved images.
            cache_key="pr-${PR_NUMBER}"
          else
            cache_key="main"
          fi

          {
            echo "imageCacheKey=${cache_key}"
            echo "imageCacheFallback=${fallback}"
          } >> "$GITHUB_OUTPUT"

      - name: Save GitVersion binary
        if: always() && steps.gitversion.outputs.need_bin_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/gitversion-bin
          key: gitversion-bin-linux-x64-6.7.0

      - name: Save SemVer floor
        if: always() && steps.gitversion.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /tmp/gitversion-prev
          key: gitversion-semver-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

      - name: Upload version metadata
        if: always() && steps.gitversion.outcome == 'success'
        run: |
          mkdir -p version-meta
          {
            echo "BUILD_VERSION=${{ steps.gitversion.outputs.semVer }}"
            echo "GITVERSION_INFORMATIONALVERSION=${{ steps.gitversion.outputs.informationalVersion }}"
            echo "OTEL_SERVICE_VERSION=${{ steps.gitversion.outputs.informationalVersion }}"
          } > version-meta/version.env

      - name: Upload version-meta artifact
        if: always() && steps.gitversion.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: version-meta
          path: version-meta/
          retention-days: 1
          if-no-files-found: error

      - name: Display version
        run: |
          {
            echo "## Build version"
            echo ""
            echo "- SemVer: \`${{ steps.gitversion.outputs.semVer }}\`"
            echo "- AssemblySemVer: \`${{ steps.gitversion.outputs.assemblySemVer }}\`"
            echo "- InformationalVersion: \`${{ steps.gitversion.outputs.informationalVersion }}\`"
            echo "- MajorMinorPatch: \`${{ steps.gitversion.outputs.majorMinorPatch }}\`"
            echo "- Image cache key: \`${{ steps.gitversion.outputs.imageCacheKey }}\`"
            echo "- Image cache fallback: \`${{ steps.gitversion.outputs.imageCacheFallback }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "ImageCacheKey: ${{ steps.gitversion.outputs.imageCacheKey }}"
          echo "ImageCacheFallback: ${{ steps.gitversion.outputs.imageCacheFallback }}"

  # Runs in parallel with Version. Cache keys derived from GitHub context; SemVer applied before tests.
  ci:
    name: Build
    # Private repos: ubuntu-latest is 2 vCPU (public is 4). See GitHub-hosted runners docs.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve image cache keys
        id: cache-keys
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-resolve-image-cache-keys.sh

      - name: Restore BuildKit image cache
        id: tooling-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sidecar-images/tooling.tar
          key: docker-tooling-v1-buildx-stable-1

      # Critical path: start tooling docker load while sidecar GHA restore downloads.
      - name: Load BuildKit image (background)
        run: bash scripts/ci-load-tooling-bg.sh

      - name: Restore sidecar image cache
        id: sidecar-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sidecar-images/sidecars.tar
          key: docker-sidecars-v8-${{ steps.cache-keys.outputs.imageCacheKey }}-${{ hashFiles('docker-compose.ci.yml') }}
          restore-keys: |
            docker-sidecars-v8-${{ steps.cache-keys.outputs.imageCacheFallback }}-${{ hashFiles('docker-compose.ci.yml') }}
            docker-sidecars-v8-${{ steps.cache-keys.outputs.imageCacheFallback }}-
            docker-sidecars-v8-

      - name: Wait for BuildKit image
        run: bash scripts/ci-wait-tooling.sh

      # After tooling load — sidecars must not contend for the Docker daemon lock.
      - name: Start sidecars (background)
        run: bash scripts/ci-start-sidecars-bg.sh

      # docker-container is required for type=gha cache export; docker driver cannot.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Skip cache-to when this exact source tree already exported (warm no-op builds).
      - name: Check BuildKit export marker
        id: bk-export
        uses: actions/cache/restore@v4
        with:
          path: /tmp/buildkit-export-marker
          key: buildkit-export-v1-${{ hashFiles('Dockerfile.ci', 'Directory.Build.props', 'global.json', 'src/**/*.cs', 'src/**/*.csproj', 'tests/**/*.cs', 'tests/**/*.csproj', '**/packages.lock.json', '**/packages.ci.lock.json', 'Soundtrail.Services.ServiceDefaults/**/*.cs', 'Soundtrail.Services.ServiceDefaults/**/*.csproj', 'Soundtrail.Services.AppHost/servicebus-emulator/Config.json') }}
          lookup-only: true

      - name: Build testhost
        id: build-testhost
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          target: publish-testhost-out
          outputs: type=local,dest=testhost
          cache-from: type=gha,scope=soundtrail-testhost
          cache-to: ${{ steps.bk-export.outputs.cache-hit != 'true' && 'type=gha,mode=max,scope=soundtrail-testhost' || '' }}

      - name: Apply version metadata
        run: bash scripts/ci-await-version-meta.sh

      - name: Run tests
        run: bash scripts/ci-run-tests.sh

      - name: Publish apps
        id: publish-apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          target: publish-apps-out
          outputs: type=local,dest=package/publish
          cache-from: type=gha,scope=soundtrail-testhost
          cache-to: ${{ steps.bk-export.outputs.cache-hit != 'true' && 'type=gha,mode=max,scope=soundtrail-testhost' || '' }}

      - name: Save BuildKit export marker
        # Stamp when we exported; do not require tests so flaky tests do not force re-export.
        if: always() && steps.bk-export.outputs.cache-hit != 'true' && steps.build-testhost.outcome == 'success'
        run: |
          mkdir -p /tmp/buildkit-export-marker
          date -u > /tmp/buildkit-export-marker/stamp

      - name: Upload BuildKit export marker
        if: always() && steps.bk-export.outputs.cache-hit != 'true' && steps.build-testhost.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/buildkit-export-marker
          key: buildkit-export-v1-${{ hashFiles('Dockerfile.ci', 'Directory.Build.props', 'global.json', 'src/**/*.cs', 'src/**/*.csproj', 'tests/**/*.cs', 'tests/**/*.csproj', '**/packages.lock.json', '**/packages.ci.lock.json', 'Soundtrail.Services.ServiceDefaults/**/*.cs', 'Soundtrail.Services.ServiceDefaults/**/*.csproj', 'Soundtrail.Services.AppHost/servicebus-emulator/Config.json') }}

      - name: Stop test dependencies
        id: stop-sidecars
        if: always()
        env:
          SEED_TOOLING_CACHE: ${{ steps.tooling-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
          SEED_SIDECAR_CACHE: ${{ steps.sidecar-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          echo "tooling_cache=false" >> "$GITHUB_OUTPUT"
          echo "sidecar_cache=false" >> "$GITHUB_OUTPUT"

          deadline=$((SECONDS + 90))
          while [[ ! -f /tmp/sidecars.done && ! -f /tmp/sidecars.failed && $SECONDS -lt $deadline ]]; do
            sleep 1
          done

          seed_sidecars="$SEED_SIDECAR_CACHE"
          if [[ -f /tmp/sidecars.need-reseed ]]; then
            seed_sidecars=true
          fi

          if [[ "$SEED_TOOLING_CACHE" == "true" || "$seed_sidecars" == "true" ]]; then
            if [[ "$seed_sidecars" == "true" ]]; then
              rm -f /tmp/sidecar-images/sidecars.tar
            fi
            if [[ "$SEED_TOOLING_CACHE" == "true" ]]; then
              rm -f /tmp/sidecar-images/tooling.tar
            fi
            bash scripts/ci-save-sidecar-images.sh
          fi

          docker compose -f docker-compose.ci.yml down -v --remove-orphans || true

          sidecar=/tmp/sidecar-images/sidecars.tar
          tooling=/tmp/sidecar-images/tooling.tar
          if [[ "$SEED_TOOLING_CACHE" == "true" && -f "$tooling" ]]; then
            tooling_size=$(stat -c%s "$tooling")
            echo "tooling tar bytes=$tooling_size"
            if (( tooling_size >= 100000 )); then
              echo "tooling_cache=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$tooling"
            fi
          fi
          if [[ "$seed_sidecars" == "true" && -f "$sidecar" ]]; then
            sidecar_size=$(stat -c%s "$sidecar")
            echo "sidecar tar bytes=$sidecar_size"
            if (( sidecar_size >= 10000000 )); then
              echo "sidecar_cache=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$sidecar"
            fi
          fi

      - name: Save BuildKit image cache
        if: always() && steps.tooling-cache.outputs.cache-hit != 'true' && steps.stop-sidecars.outputs.tooling_cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/sidecar-images/tooling.tar
          key: docker-tooling-v1-buildx-stable-1

      - name: Save sidecar image cache
        if: always() && steps.sidecar-cache.outputs.cache-hit != 'true' && steps.stop-sidecars.outputs.sidecar_cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/sidecar-images/sidecars.tar
          key: docker-sidecars-v8-${{ steps.cache-keys.outputs.imageCacheKey }}-${{ hashFiles('docker-compose.ci.yml') }}

      # Package: version + TRX (+ published apps on main).
      - name: Prepare build package
        if: always()
        run: |
          mkdir -p package/reports
          if compgen -G "reports/*" > /dev/null; then
            cp -a reports/. package/reports/
          fi
          if [[ -z "${BUILD_VERSION:-}" ]]; then
            bash scripts/ci-await-version-meta.sh || true
          fi
          printf '%s\n' "${BUILD_VERSION:-unknown}" > package/version.txt
          if [[ -d package/publish ]]; then
            {
              echo "Version=${BUILD_VERSION:-unknown}"
              echo "OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}"
              echo "# Deploy: set OTEL_SERVICE_VERSION on each service process from this value."
            } > package/publish-versions.txt
          fi

      - name: Upload build package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: package/

  release:
    name: Release
    needs: [version, ci]
    # Keep a static check name for branch protection even when Build's display name includes SemVer.
    # Run after Version even if Build fails so TRX can still be published, then fail the job if Build did.
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && needs.ci.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download build package
        uses: actions/download-artifact@v7
        with:
          name: build
          path: package

      - name: Publish test results
        if: github.event_name == 'pull_request'
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: package/reports/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          fail-on-empty: false

      - name: Tag release version
        if: needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: v${{ needs.version.outputs.semVer }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created and pushed $TAG"

      - name: Require build success
        if: needs.ci.result != 'success'
        run: |
          echo "::error::Build did not succeed (result=${{ needs.ci.result }})"
          exit 1
