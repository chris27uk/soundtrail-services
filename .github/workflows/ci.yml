name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

run-name: "${{ github.event.pull_request.title || github.ref_name }} (${{ github.run_number }})"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  checks: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: gitversion
        env:
          GITVERSION_IMAGE: gittools/gitversion:6.7.0-ubuntu.24.04-8.0
        run: |
          set -euo pipefail

          docker pull "$GITVERSION_IMAGE"

          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            --env GITHUB_ACTIONS=true \
            --env GITHUB_REF \
            --env GITHUB_BASE_REF \
            --env GITHUB_HEAD_REF \
            --entrypoint /tools/dotnet-gitversion \
            "$GITVERSION_IMAGE" \
            /output json > /tmp/gitversion.json 2> /tmp/gitversion.err
          gv_exit=$?
          set -e

          if [[ -s /tmp/gitversion.err ]]; then
            echo "GitVersion stderr:" >&2
            cat /tmp/gitversion.err >&2
          fi

          if [[ $gv_exit -ne 0 ]]; then
            echo "::error::GitVersion exited with code $gv_exit"
            echo "GitVersion stdout:" >&2
            cat /tmp/gitversion.json >&2 || true
            exit "$gv_exit"
          fi

          jq -r '
            "semVer=\(.SemVer)",
            "assemblySemVer=\(.AssemblySemVer)",
            "informationalVersion=\(.InformationalVersion)",
            "majorMinorPatch=\(.MajorMinorPatch)"
          ' /tmp/gitversion.json >> "$GITHUB_OUTPUT"

      - name: Display version
        run: |
          {
            echo "## Build version"
            echo ""
            echo "- SemVer: \`${{ steps.gitversion.outputs.semVer }}\`"
            echo "- AssemblySemVer: \`${{ steps.gitversion.outputs.assemblySemVer }}\`"
            echo "- InformationalVersion: \`${{ steps.gitversion.outputs.informationalVersion }}\`"
            echo "- MajorMinorPatch: \`${{ steps.gitversion.outputs.majorMinorPatch }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"

  # Each matrix leg gets a fresh runner. Undersized hosts soft-skip; a later leg builds.
  # (gh run rerun cannot run while this workflow is still in progress.)
  ci:
    name: Build ${{ needs.version.outputs.semVer }} (${{ matrix.attempt }}/8)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Undersized hosts soft-succeed (exit 0); a real build failure cancels further attempts.
      fail-fast: true
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      NUGET_PACKAGES_HOST: ${{ github.workspace }}/.nuget/packages
      BUILD_VERSION: ${{ needs.version.outputs.semVer }}
      GITVERSION_INFORMATIONALVERSION: ${{ needs.version.outputs.informationalVersion }}

    steps:
      - name: Check whether a prior attempt already built
        id: prior
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ci-build-ok
          path: .ci-build-ok

      - name: Decide whether to build on this runner
        id: gate
        run: |
          set -euo pipefail
          if [ -f .ci-build-ok/ok ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "Prior attempt already produced a build; skipping."
            exit 0
          fi

          cpus="$(nproc)"
          echo "attempt=${{ matrix.attempt }}/8 host nproc=${cpus}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$cpus" -lt 4 ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Undersized runner (${cpus} vCPUs); soft-skipping so the next matrix attempt can land on a 4-vCPU host."
            exit 0
          fi

          echo "usable=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.usable == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve CI image
        if: steps.gate.outputs.usable == 'true'
        id: ci-image
        run: |
          tag="$(sha256sum .github/docker/Dockerfile.ci | cut -c1-16)"
          image="ghcr.io/${{ github.repository_owner }}/soundtrail-services-ci:${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "CI image: ${image}"

      - name: Log in to GHCR
        if: steps.gate.outputs.usable == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        if: steps.gate.outputs.usable == 'true'
        run: |
          image="${{ steps.ci-image.outputs.image }}"
          if docker pull "$image"; then
            echo "Pulled $image"
            exit 0
          fi

          echo "Image not in GHCR; building and publishing $image"
          docker build \
            --platform linux/amd64 \
            --file .github/docker/Dockerfile.ci \
            --tag "$image" \
            .github/docker
          docker push "$image"

      - name: Cache NuGet packages
        if: steps.gate.outputs.usable == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES_HOST }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '.github/docker/Dockerfile.ci') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Intermediate outputs only — bin holds Raven Embedded data (root-owned, unreadable to cache).
      - name: Cache MSBuild outputs
        if: steps.gate.outputs.usable == 'true'
        uses: actions/cache@v6
        with:
          path: |
            **/obj
          key: ${{ runner.os }}-msbuild-obj-${{ hashFiles('.github/docker/Dockerfile.ci', 'global.json', 'Directory.Build.props', '**/packages.lock.json', '**/packages.*.lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-msbuild-obj-${{ hashFiles('.github/docker/Dockerfile.ci', 'global.json', 'Directory.Build.props', '**/packages.lock.json', '**/packages.*.lock.json') }}-

      - name: Restore, Build and Test
        if: steps.gate.outputs.usable == 'true'
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/src" \
            --volume "${{ env.NUGET_PACKAGES_HOST }}:/root/.nuget/packages" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --add-host=host.docker.internal:host-gateway \
            --env NUGET_PACKAGES=/root/.nuget/packages \
            --env GITHUB_ACTIONS=true \
            --env GITVERSION_INFORMATIONALVERSION \
            --env TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            --env TESTCONTAINERS_RYUK_DISABLED=true \
            --workdir /src \
            "${{ steps.ci-image.outputs.image }}" \
            pwsh ./build.ps1 -Restore -Configuration Release -Version "$BUILD_VERSION"

      # Docker leaves root-owned trees; make obj cacheable and drop Raven runtime junk.
      - name: Fix workspace permissions for caches
        if: always() && steps.gate.outputs.usable == 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          find . -type d -name RavenDB -prune -exec rm -rf {} +

      # Single package for Release: version stamp + whatever TRX the build produced.
      - name: Prepare build package
        if: success() && steps.gate.outputs.usable == 'true'
        run: |
          mkdir -p package/reports
          if compgen -G "reports/*" > /dev/null; then
            cp -a reports/. package/reports/
          fi
          printf '%s\n' "$BUILD_VERSION" > package/version.txt

      - name: Upload build package
        if: success() && steps.gate.outputs.usable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: package/

      - name: Mark attempt succeeded
        if: success() && steps.gate.outputs.usable == 'true'
        run: |
          mkdir -p .ci-build-ok
          echo ok > .ci-build-ok/ok

      - name: Upload success marker
        if: success() && steps.gate.outputs.usable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-ok
          path: .ci-build-ok/

  ci-ok:
    name: Build gate
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a successful 4-vCPU build attempt
        uses: actions/download-artifact@v7
        with:
          name: ci-build-ok
          path: .ci-build-ok

      - name: Confirm marker
        run: |
          if [ ! -f .ci-build-ok/ok ]; then
            echo "::error::No CI attempt produced a build (likely never landed a 4-vCPU runner)."
            exit 1
          fi
          echo "Build attempt succeeded."

  release:
    name: Release
    needs: [version, ci-ok]
    # Keep a static check name for branch protection even when Build's display name includes SemVer.
    # Run after Version even if Build fails so TRX can still be published, then fail the job if Build did.
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && needs.ci-ok.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build package
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: build
          path: package

      - name: Publish test results
        if: github.event_name == 'pull_request'
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: package/reports/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          fail-on-empty: false

      - name: Tag release version
        if: needs.ci-ok.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: v${{ needs.version.outputs.majorMinorPatch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created and pushed $TAG"

      - name: Require build success
        if: needs.ci-ok.result != 'success'
        run: |
          echo "::error::Build did not succeed (result=${{ needs.ci-ok.result }})"
          exit 1
