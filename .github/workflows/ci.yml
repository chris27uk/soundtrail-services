name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      semVer:
        description: GitVersion SemVer for this build
        required: true
        type: string
      informationalVersion:
        description: GitVersion informational version
        required: true
        type: string
      majorMinorPatch:
        description: GitVersion major.minor.patch
        required: true
        type: string
      shouldTag:
        description: Push a vX.Y.Z tag after a successful main build
        required: false
        type: boolean
        default: false
      isPullRequest:
        description: Whether the originating event was a pull request
        required: false
        type: boolean
        default: false

run-name: "${{ inputs.semVer && format('Build {0}', inputs.semVer) || format('CI {0} ({1})', github.ref_name, github.run_number) }}"

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.semVer || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  checks: write
  pull-requests: write

jobs:
  version:
    if: github.event_name != 'workflow_dispatch'
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      buildRunId: ${{ steps.dispatch.outputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.7.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Display version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"

      - name: Start versioned build
        id: dispatch
        uses: actions/github-script@v7
        env:
          SEM_VER: ${{ steps.gitversion.outputs.semVer }}
          INFORMATIONAL_VERSION: ${{ steps.gitversion.outputs.informationalVersion }}
          MAJOR_MINOR_PATCH: ${{ steps.gitversion.outputs.majorMinorPatch }}
        with:
          script: |
            const ref = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.ref
              : context.ref.replace(/^refs\/heads\//, '');
            const startedAfter = new Date();
            const semVer = process.env.SEM_VER;

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref,
              inputs: {
                semVer,
                informationalVersion: process.env.INFORMATIONAL_VERSION,
                majorMinorPatch: process.env.MAJOR_MINOR_PATCH,
                shouldTag: String(context.eventName === 'push' && ref === 'main'),
                isPullRequest: String(context.eventName === 'pull_request')
              }
            });

            core.info(`Dispatched versioned build for ${semVer} on ${ref}`);

            let runId = null;
            for (let attempt = 0; attempt < 30 && !runId; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 2000));
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                event: 'workflow_dispatch',
                branch: ref,
                per_page: 10
              });

              const match = response.data.workflow_runs.find(run =>
                run.display_title === `Build ${semVer}` &&
                new Date(run.created_at) >= startedAfter
              );

              if (match) {
                runId = match.id;
              }
            }

            if (!runId) {
              throw new Error(`Timed out waiting for versioned build run 'Build ${semVer}' to appear.`);
            }

            core.setOutput('run_id', String(runId));
            core.info(`Versioned build run: ${runId}`);

      - name: Wait for versioned build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --exit-status

  ci:
    if: github.event_name == 'workflow_dispatch'
    name: Build ${{ inputs.semVer }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI_IMAGE: soundtrail-services-ci:local
      NUGET_PACKAGES_HOST: ${{ github.workspace }}/.nuget/packages
      BUILD_VERSION: ${{ inputs.semVer }}
      GITVERSION_INFORMATIONALVERSION: ${{ inputs.informationalVersion }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build CI image
        run: docker build -t "$CI_IMAGE" -f .github/docker/Dockerfile.ci .

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES_HOST }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '.github/docker/Dockerfile.ci') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/src" \
            --volume "${{ env.NUGET_PACKAGES_HOST }}:/root/.nuget/packages" \
            --env NUGET_PACKAGES=/root/.nuget/packages \
            --env GITVERSION_INFORMATIONALVERSION \
            --workdir /src \
            "$CI_IMAGE" \
            pwsh ./build.ps1 -Restore -Configuration Release -Version "$BUILD_VERSION"

      - name: Build and Test
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/src" \
            --volume "${{ env.NUGET_PACKAGES_HOST }}:/root/.nuget/packages" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --add-host=host.docker.internal:host-gateway \
            --env NUGET_PACKAGES=/root/.nuget/packages \
            --env GITVERSION_INFORMATIONALVERSION \
            --env TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            --env TESTCONTAINERS_RYUK_DISABLED=true \
            --workdir /src \
            "$CI_IMAGE" \
            pwsh ./build.ps1 -Configuration Release -Version "$BUILD_VERSION"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Publish test results
        if: always() && inputs.isPullRequest == 'true'
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: reports/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Tag release version
        if: inputs.shouldTag == 'true'
        env:
          TAG: v${{ inputs.majorMinorPatch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created and pushed $TAG"
