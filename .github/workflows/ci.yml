name: CI

on:
  push:
    branches: [main]
    # Push e.g. ci-cache/1 from a branch to seed image + BuildKit caches without merging.
    tags: ['ci-cache/**']
  pull_request:
    branches: [main]

run-name: "${{ github.event.pull_request.title || github.ref_name }} (${{ github.run_number }})"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write
  actions: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: gitversion
        env:
          GITVERSION_IMAGE: gittools/gitversion:6.7.0-ubuntu.24.04-8.0
        run: |
          set -euo pipefail

          docker pull "$GITVERSION_IMAGE"

          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            --env GITHUB_ACTIONS=true \
            --env GITHUB_REF \
            --env GITHUB_BASE_REF \
            --env GITHUB_HEAD_REF \
            --entrypoint /tools/dotnet-gitversion \
            "$GITVERSION_IMAGE" \
            /output json > /tmp/gitversion.json 2> /tmp/gitversion.err
          gv_exit=$?
          set -e

          if [[ -s /tmp/gitversion.err ]]; then
            echo "GitVersion stderr:" >&2
            cat /tmp/gitversion.err >&2
          fi

          if [[ $gv_exit -ne 0 ]]; then
            echo "::error::GitVersion exited with code $gv_exit"
            echo "GitVersion stdout:" >&2
            cat /tmp/gitversion.json >&2 || true
            exit "$gv_exit"
          fi

          jq -r '
            "semVer=\(.SemVer)",
            "assemblySemVer=\(.AssemblySemVer)",
            "informationalVersion=\(.InformationalVersion)",
            "majorMinorPatch=\(.MajorMinorPatch)"
          ' /tmp/gitversion.json >> "$GITHUB_OUTPUT"

      - name: Display version
        run: |
          {
            echo "## Build version"
            echo ""
            echo "- SemVer: \`${{ steps.gitversion.outputs.semVer }}\`"
            echo "- AssemblySemVer: \`${{ steps.gitversion.outputs.assemblySemVer }}\`"
            echo "- InformationalVersion: \`${{ steps.gitversion.outputs.informationalVersion }}\`"
            echo "- MajorMinorPatch: \`${{ steps.gitversion.outputs.majorMinorPatch }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"

  ci:
    name: Build ${{ needs.version.outputs.semVer }}
    needs: version
    # Private repos: ubuntu-latest is 2 vCPU (public is 4). See GitHub-hosted runners docs.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_VERSION: ${{ needs.version.outputs.semVer }}
      GITVERSION_INFORMATIONALVERSION: ${{ needs.version.outputs.informationalVersion }}
      OTEL_SERVICE_VERSION: ${{ needs.version.outputs.informationalVersion }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore sidecar image cache
        id: sidecar-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sidecar-images
          # v3: sidecars.tar + tooling.tar (BuildKit + aspnet) for bootstrap / no testhost --load.
          key: docker-sidecars-v3-${{ hashFiles('docker-compose.ci.yml') }}

      - name: Start test dependencies
        run: |
          set -euo pipefail
          mkdir -p reports testhost /tmp/sidecar-images
          # Overlap Raven/OSB/Redis load+health with tooling load + testhost build.
          nohup bash scripts/ci-start-sidecars.sh >/tmp/sidecars.log 2>&1 &
          echo $! > /tmp/sidecars.pid
          disown || true

      # docker-container is required for type=gha cache export; docker driver cannot.
      # Prefetch BuildKit so setup-buildx skips the Hub pull (~5s).
      - name: Load CI tooling images
        run: bash scripts/ci-load-tooling-images.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build testhost
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          target: publish-testhost-out
          outputs: type=local,dest=testhost
          cache-from: type=gha,scope=soundtrail-testhost
          # Write BuildKit layer cache only from ci-cache/* tags (test seed); PRs restore only.
          cache-to: ${{ startsWith(github.ref, 'refs/tags/ci-cache/') && 'type=gha,mode=max,scope=soundtrail-testhost' || '' }}

      - name: Wait for test dependencies
        run: bash scripts/ci-wait-sidecars.sh

      - name: Run tests
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml run --rm --no-deps testhost

      - name: Publish apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          target: publish-apps-out
          outputs: type=local,dest=package/publish
          cache-from: type=gha,scope=soundtrail-testhost

      - name: Stop test dependencies
        id: stop-sidecars
        if: always()
        env:
          CACHE_HIT: ${{ steps.sidecar-cache.outputs.cache-hit }}
          # Sidecar/tooling image cache is seeded only from ci-cache/* tags; PRs restore but never save.
          SEED_IMAGE_CACHE: ${{ startsWith(github.ref, 'refs/tags/ci-cache/') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          echo "cache=false" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + 90))
          while [[ ! -f /tmp/sidecars.done && ! -f /tmp/sidecars.failed && $SECONDS -lt $deadline ]]; do
            sleep 1
          done
          if [[ "$SEED_IMAGE_CACHE" == "true" && "$CACHE_HIT" != "true" ]]; then
            bash scripts/ci-save-sidecar-images.sh
          fi
          docker compose -f docker-compose.ci.yml down -v --remove-orphans || true
          sidecar=/tmp/sidecar-images/sidecars.tar
          tooling=/tmp/sidecar-images/tooling.tar
          if [[ "$SEED_IMAGE_CACHE" == "true" && "$CACHE_HIT" != "true" && -f "$sidecar" && -f "$tooling" ]]; then
            sidecar_size=$(stat -c%s "$sidecar")
            tooling_size=$(stat -c%s "$tooling")
            echo "sidecar tar bytes=$sidecar_size tooling tar bytes=$tooling_size"
            if (( sidecar_size >= 10000000 && tooling_size >= 1000000 )); then
              echo "cache=true" >> "$GITHUB_OUTPUT"
            else
              echo "sidecar/tooling tar too small to cache; removing"
              rm -f "$sidecar" "$tooling"
            fi
          fi

      - name: Save sidecar image cache
        if: >
          always()
          && startsWith(github.ref, 'refs/tags/ci-cache/')
          && steps.sidecar-cache.outputs.cache-hit != 'true'
          && steps.stop-sidecars.outputs.cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/sidecar-images
          key: docker-sidecars-v3-${{ hashFiles('docker-compose.ci.yml') }}

      # Package: version + TRX (+ published apps on main).
      - name: Prepare build package
        if: always()
        run: |
          mkdir -p package/reports
          if compgen -G "reports/*" > /dev/null; then
            cp -a reports/. package/reports/
          fi
          printf '%s\n' "$BUILD_VERSION" > package/version.txt
          if [[ -d package/publish ]]; then
            {
              echo "Version=$BUILD_VERSION"
              echo "OTEL_SERVICE_VERSION=$OTEL_SERVICE_VERSION"
              echo "# Deploy: set OTEL_SERVICE_VERSION on each service process from this value."
            } > package/publish-versions.txt
          fi

      - name: Upload build package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: package/

  release:
    name: Release
    needs: [version, ci]
    # Keep a static check name for branch protection even when Build's display name includes SemVer.
    # Run after Version even if Build fails so TRX can still be published, then fail the job if Build did.
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && needs.ci.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download build package
        uses: actions/download-artifact@v7
        with:
          name: build
          path: package

      - name: Publish test results
        if: github.event_name == 'pull_request'
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: package/reports/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          fail-on-empty: false

      - name: Tag release version
        if: needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: v${{ needs.version.outputs.majorMinorPatch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created and pushed $TAG"

      - name: Require build success
        if: needs.ci.result != 'success'
        run: |
          echo "::error::Build did not succeed (result=${{ needs.ci.result }})"
          exit 1
