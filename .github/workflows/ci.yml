name: CI

on:
  push:
    branches: [main]
    # Release job on main pushes v${{ semVer }}; that tag run seeds image/BuildKit caches.
    tags: ['v*']
  pull_request:
    branches: [main]

run-name: "${{ github.event.pull_request.title || github.ref_name }} (${{ github.run_number }})"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write
  actions: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      imageCacheKey: ${{ steps.gitversion.outputs.imageCacheKey }}
      imageCacheFallback: ${{ steps.gitversion.outputs.imageCacheFallback }}

    steps:
      # Caches before checkout — no workspace needed.
      - name: Restore GitVersion binary
        id: gv-bin-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/gitversion-bin
          key: gitversion-bin-linux-x64-6.7.0

      - name: Restore previous SemVer floor
        id: gv-semver-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/gitversion-prev
          key: gitversion-semver-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            gitversion-semver-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Shallow history; script fetches main + v* tags for Mainline base versions.
          fetch-depth: 100
          fetch-tags: false
          sparse-checkout: |
            GitVersion.yml
            scripts/ci-gitversion.sh
          sparse-checkout-cone-mode: false

      - name: Determine version
        id: gitversion
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-gitversion.sh

      - name: Save GitVersion binary
        if: always() && steps.gitversion.outputs.need_bin_cache == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/gitversion-bin
          key: gitversion-bin-linux-x64-6.7.0

      - name: Save SemVer floor
        if: always() && steps.gitversion.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /tmp/gitversion-prev
          key: gitversion-semver-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

      - name: Package version metadata
        if: always() && steps.gitversion.outcome == 'success'
        run: |
          mkdir -p version-meta
          {
            echo "BUILD_VERSION=${{ steps.gitversion.outputs.semVer }}"
            echo "GITVERSION_INFORMATIONALVERSION=${{ steps.gitversion.outputs.informationalVersion }}"
            echo "OTEL_SERVICE_VERSION=${{ steps.gitversion.outputs.informationalVersion }}"
          } > version-meta/version.env

      - name: Upload version metadata
        if: always() && steps.gitversion.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: version-meta
          path: version-meta/
          if-no-files-found: error

      - name: Summary
        if: always() && steps.gitversion.outcome == 'success'
        run: |
          {
            echo "## Build version"
            echo ""
            echo "- SemVer: \`${{ steps.gitversion.outputs.semVer }}\`"
            echo "- InformationalVersion: \`${{ steps.gitversion.outputs.informationalVersion }}\`"
            echo "- MajorMinorPatch: \`${{ steps.gitversion.outputs.majorMinorPatch }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Parallel with Version. SemVer arrives via version-meta (await overlaps testhost build).
  ci:
    name: Build
    # Private repos: ubuntu-latest is 2 vCPU (public is 4). See GitHub-hosted runners docs.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "true"
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve image cache keys
        id: cache-keys
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-resolve-image-cache-keys.sh

      # Start before caches/build so Version (≈8s) finishes during Build setup.
      - name: Await version metadata (background)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-await-version-meta-bg.sh

      # Skip cache-to when this exact source tree already exported (warm no-op builds).
      - name: Check BuildKit export marker
        id: bk-export
        uses: actions/cache/restore@v4
        with:
          path: /tmp/buildkit-export-marker
          key: buildkit-export-v1-${{ hashFiles('Dockerfile.ci', 'Directory.Build.props', 'global.json', 'src/**/*.cs', 'src/**/*.csproj', 'tests/**/*.cs', 'tests/**/*.csproj', '**/packages.lock.json', '**/packages.ci.lock.json', 'Soundtrail.Services.ServiceDefaults/**/*.cs', 'Soundtrail.Services.ServiceDefaults/**/*.csproj', 'Soundtrail.Services.AppHost/servicebus-emulator/Config.json') }}
          lookup-only: true

      # Sidecars first so docker load overlaps tooling GHA restore.
      - name: Restore sidecar image cache
        id: sidecar-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sidecar-images/sidecars.tar
          key: docker-sidecars-v9-${{ steps.cache-keys.outputs.imageCacheKey }}-${{ hashFiles('docker-compose.ci.yml') }}
          restore-keys: |
            docker-sidecars-v9-${{ steps.cache-keys.outputs.imageCacheFallback }}-${{ hashFiles('docker-compose.ci.yml') }}
            docker-sidecars-v9-${{ steps.cache-keys.outputs.imageCacheFallback }}-
            docker-sidecars-v9-

      - name: Load sidecar images (background)
        run: bash scripts/ci-load-sidecars-bg.sh

      - name: Restore BuildKit image cache
        id: tooling-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sidecar-images/tooling.tar
          key: docker-tooling-v1-buildx-stable-1

      # Avoid docker daemon lock fights: finish sidecar load before tooling load.
      - name: Wait for sidecar images
        run: bash scripts/ci-wait-sidecars-loaded.sh

      - name: Load BuildKit image
        run: bash scripts/ci-load-tooling-images.sh

      # Healthchecks overlap Buildx + testhost.
      - name: Start sidecars (background)
        run: bash scripts/ci-start-sidecars-bg.sh

      # docker-container is required for type=gha cache; thin script avoids setup-buildx-action overhead.
      - name: Set up Docker Buildx
        run: bash scripts/ci-setup-buildx.sh

      # Aspnet only needed for compose run testhost — load during Buildx/testhost.
      - name: Restore runtime image cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/sidecar-images/runtime.tar
          key: docker-runtime-v1-aspnet-10.0.9-noble

      - name: Load runtime image (background)
        run: bash scripts/ci-load-runtime-bg.sh

      - name: Build testhost
        id: build-testhost
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          builder: soundtrail-ci
          target: publish-testhost-out
          outputs: type=local,dest=testhost
          provenance: false
          sbom: false
          cache-from: type=gha,scope=soundtrail-testhost
          cache-to: ${{ steps.bk-export.outputs.cache-hit != 'true' && 'type=gha,mode=max,scope=soundtrail-testhost' || '' }}

      - name: Apply version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-await-version-meta-wait.sh

      - name: Run tests
        run: bash scripts/ci-run-tests.sh

      - name: Publish apps
        id: publish-apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          builder: soundtrail-ci
          target: publish-apps-out
          outputs: type=local,dest=package/publish
          provenance: false
          sbom: false
          cache-from: type=gha,scope=soundtrail-testhost
          cache-to: ${{ steps.bk-export.outputs.cache-hit != 'true' && 'type=gha,mode=max,scope=soundtrail-testhost' || '' }}

      - name: Save BuildKit export marker
        # Stamp when we exported; do not require tests so flaky tests do not force re-export.
        if: always() && steps.bk-export.outputs.cache-hit != 'true' && steps.build-testhost.outcome == 'success'
        run: |
          mkdir -p /tmp/buildkit-export-marker
          date -u > /tmp/buildkit-export-marker/stamp

      - name: Upload BuildKit export marker
        if: always() && steps.bk-export.outputs.cache-hit != 'true' && steps.build-testhost.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/buildkit-export-marker
          key: buildkit-export-v1-${{ hashFiles('Dockerfile.ci', 'Directory.Build.props', 'global.json', 'src/**/*.cs', 'src/**/*.csproj', 'tests/**/*.cs', 'tests/**/*.csproj', '**/packages.lock.json', '**/packages.ci.lock.json', 'Soundtrail.Services.ServiceDefaults/**/*.cs', 'Soundtrail.Services.ServiceDefaults/**/*.csproj', 'Soundtrail.Services.AppHost/servicebus-emulator/Config.json') }}

      - name: Stop test dependencies
        id: stop-sidecars
        if: always()
        env:
          SEED_TOOLING_CACHE: ${{ steps.tooling-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
          SEED_SIDECAR_CACHE: ${{ steps.sidecar-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
          SEED_RUNTIME_CACHE: ${{ steps.runtime-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          echo "tooling_cache=false" >> "$GITHUB_OUTPUT"
          echo "sidecar_cache=false" >> "$GITHUB_OUTPUT"
          echo "runtime_cache=false" >> "$GITHUB_OUTPUT"

          deadline=$((SECONDS + 90))
          while [[ ! -f /tmp/sidecars.done && ! -f /tmp/sidecars.failed && $SECONDS -lt $deadline ]]; do
            sleep 1
          done

          seed_sidecars="$SEED_SIDECAR_CACHE"
          if [[ -f /tmp/sidecars.need-reseed ]]; then
            seed_sidecars=true
          fi
          seed_runtime="$SEED_RUNTIME_CACHE"
          if [[ -f /tmp/runtime.need-reseed ]]; then
            seed_runtime=true
          fi

          if [[ "$SEED_TOOLING_CACHE" == "true" || "$seed_sidecars" == "true" || "$seed_runtime" == "true" ]]; then
            if [[ "$seed_sidecars" == "true" ]]; then
              rm -f /tmp/sidecar-images/sidecars.tar
            fi
            if [[ "$SEED_TOOLING_CACHE" == "true" ]]; then
              rm -f /tmp/sidecar-images/tooling.tar
            fi
            if [[ "$seed_runtime" == "true" ]]; then
              rm -f /tmp/sidecar-images/runtime.tar
            fi
            bash scripts/ci-save-sidecar-images.sh
          fi

          docker compose -f docker-compose.ci.yml down -v --remove-orphans --timeout 1 || true

          sidecar=/tmp/sidecar-images/sidecars.tar
          tooling=/tmp/sidecar-images/tooling.tar
          runtime=/tmp/sidecar-images/runtime.tar
          if [[ "$SEED_TOOLING_CACHE" == "true" && -f "$tooling" ]]; then
            tooling_size=$(stat -c%s "$tooling")
            echo "tooling tar bytes=$tooling_size"
            if (( tooling_size >= 100000 )); then
              echo "tooling_cache=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$tooling"
            fi
          fi
          if [[ "$seed_sidecars" == "true" && -f "$sidecar" ]]; then
            sidecar_size=$(stat -c%s "$sidecar")
            echo "sidecar tar bytes=$sidecar_size"
            if (( sidecar_size >= 10000000 )); then
              echo "sidecar_cache=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$sidecar"
            fi
          fi
          if [[ "$seed_runtime" == "true" && -f "$runtime" ]]; then
            runtime_size=$(stat -c%s "$runtime")
            echo "runtime tar bytes=$runtime_size"
            if (( runtime_size >= 100000 )); then
              echo "runtime_cache=true" >> "$GITHUB_OUTPUT"
            else
              rm -f "$runtime"
            fi
          fi

      - name: Save BuildKit image cache
        if: always() && steps.tooling-cache.outputs.cache-hit != 'true' && steps.stop-sidecars.outputs.tooling_cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/sidecar-images/tooling.tar
          key: docker-tooling-v1-buildx-stable-1

      - name: Save sidecar image cache
        if: always() && steps.sidecar-cache.outputs.cache-hit != 'true' && steps.stop-sidecars.outputs.sidecar_cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/sidecar-images/sidecars.tar
          key: docker-sidecars-v9-${{ steps.cache-keys.outputs.imageCacheKey }}-${{ hashFiles('docker-compose.ci.yml') }}

      - name: Save runtime image cache
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true' && steps.stop-sidecars.outputs.runtime_cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/sidecar-images/runtime.tar
          key: docker-runtime-v1-aspnet-10.0.9-noble

      # Package: version + TRX (+ published apps on main).
      - name: Prepare build package
        if: always()
        run: |
          mkdir -p package/reports
          if compgen -G "reports/*" > /dev/null; then
            cp -a reports/. package/reports/
          fi
          if [[ -z "${BUILD_VERSION:-}" ]]; then
            echo "::warning::BUILD_VERSION unset; writing unknown"
          fi
          printf '%s\n' "${BUILD_VERSION:-unknown}" > package/version.txt
          if [[ -d package/publish ]]; then
            {
              echo "Version=${BUILD_VERSION:-unknown}"
              echo "OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}"
              echo "# Deploy: set OTEL_SERVICE_VERSION on each service process from this value."
            } > package/publish-versions.txt
          fi

      - name: Upload build package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: package/

  release:
    name: Release
    needs: [version, ci]
    # Keep a static check name for branch protection even when Build's display name includes SemVer.
    # Run after Version even if Build fails so TRX can still be published, then fail the job if Build did.
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && needs.ci.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download build package
        uses: actions/download-artifact@v7
        with:
          name: build
          path: package

      - name: Publish test results
        if: github.event_name == 'pull_request'
        uses: dorny/test-reporter@v3
        with:
          name: Test Results
          path: package/reports/*.trx
          reporter: dotnet-trx
          fail-on-error: true
          fail-on-empty: false

      - name: Tag release version
        if: needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: v${{ needs.version.outputs.semVer }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created and pushed $TAG"

      - name: Require build success
        if: needs.ci.result != 'success'
        run: |
          echo "::error::Build did not succeed (result=${{ needs.ci.result }})"
          exit 1
