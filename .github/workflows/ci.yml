name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

run-name: "${{ github.event.pull_request.title || github.ref_name }} (${{ github.run_number }})"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  checks: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: gittools/gitversion:6.7.0-ubuntu.24.04-8.0
      options: --entrypoint ""
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          /tools/dotnet-gitversion /output json > /tmp/gitversion.json
          perl -MJSON::PP -e '
            open my $fh, "<", "/tmp/gitversion.json" or die $!;
            my $v = decode_json(do { local $/; <$fh> });
            open my $out, ">>", $ENV{GITHUB_OUTPUT} or die $!;
            print $out "semVer=$v->{SemVer}\n";
            print $out "assemblySemVer=$v->{AssemblySemVer}\n";
            print $out "informationalVersion=$v->{InformationalVersion}\n";
            print $out "majorMinorPatch=$v->{MajorMinorPatch}\n";
          '

      - name: Display version
        run: |
          {
            echo "## Build version"
            echo ""
            echo "- SemVer: \`${{ steps.gitversion.outputs.semVer }}\`"
            echo "- AssemblySemVer: \`${{ steps.gitversion.outputs.assemblySemVer }}\`"
            echo "- InformationalVersion: \`${{ steps.gitversion.outputs.informationalVersion }}\`"
            echo "- MajorMinorPatch: \`${{ steps.gitversion.outputs.majorMinorPatch }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"

  ci:
    name: Build ${{ needs.version.outputs.semVer }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI_IMAGE: soundtrail-services-ci:local
      NUGET_PACKAGES_HOST: ${{ github.workspace }}/.nuget/packages
      BUILD_VERSION: ${{ needs.version.outputs.semVer }}
      GITVERSION_INFORMATIONALVERSION: ${{ needs.version.outputs.informationalVersion }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/Dockerfile.ci
          tags: ${{ env.CI_IMAGE }}
          load: true
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES_HOST }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '.github/docker/Dockerfile.ci') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore, Build and Test
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/src" \
            --volume "${{ env.NUGET_PACKAGES_HOST }}:/root/.nuget/packages" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --add-host=host.docker.internal:host-gateway \
            --env NUGET_PACKAGES=/root/.nuget/packages \
            --env GITHUB_ACTIONS=true \
            --env GITVERSION_INFORMATIONALVERSION \
            --env TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
            --env TESTCONTAINERS_RYUK_DISABLED=true \
            --workdir /src \
            "$CI_IMAGE" \
            pwsh ./build.ps1 -Restore -Configuration Release -Version "$BUILD_VERSION"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Publish test results
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: reports/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Tag release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: v${{ needs.version.outputs.majorMinorPatch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created and pushed $TAG"
